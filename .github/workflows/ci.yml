name: BioGraph CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt ruff black pytest
      - name: Test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Python compile
        run: python -m compileall -q .
      - name: Docker build
        run: docker build -t biograph:ci .